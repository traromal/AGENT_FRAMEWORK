name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: 88.222.214.43
        username: root
        password: noccp!^RE5WQ|s&A$@N1
        script: |
          echo "Starting deployment..."
          mkdir -p /var/www/agent_framework
          cd /var/www/agent_framework
          
          if [ -d ".git" ]; then
            echo "Pulling latest changes..."
            git pull origin main
          else
            echo "Cloning repository..."
            git clone https://github.com/traromal/AGENT_FRAMEWORK.git .
          fi
          
          echo "Code updated successfully!"
