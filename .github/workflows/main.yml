## How to Add This to GitHub:

### Method 1: Direct in GitHub (Easiest)

1. Go to your repo: `https://github.com/traromal/AGENT_FRAMEWORK`
2. Click **"Actions"** tab
3. Click **"set up a workflow yourself"**
4. **Delete everything** in the editor
5. **Paste the code above**
6. Change filename from `main.yml` to `deploy.yml`
7. Click **"Commit changes"**

