name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: 88.222.214.43
        username: root
        password: noccp!^RE5WQ|s&A$@N1
        script: |
          echo "Starting deployment..."
          mkdir -p /var/www/agent_framework
          cd /var/www/agent_framework
          
          if [ -d ".git" ]; then
            echo "Pulling latest changes..."
            git pull origin main
          else
            echo "Cloning repository..."
            git clone https://github.com/traromal/AGENT_FRAMEWORK.git .
          fi
          
          echo "Code updated successfully!"
          
          if [ -d "backend" ]; then
            echo "Updating Django backend..."
            cd backend
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install -r requirements.txt || true
            python manage.py migrate || true
            python manage.py collectstatic --noinput || true
            deactivate
            cd ..
          fi
          
          if [ -d "frontend" ]; then
            echo "Updating React frontend..."
            cd frontend
            npm install || true
            npm run build || true
            cd ..
          fi
          
          sudo systemctl restart gunicorn || true
          sudo systemctl restart nginx || true
          
          echo "Deployment complete!"
